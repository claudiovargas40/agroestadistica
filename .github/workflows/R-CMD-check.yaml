# Revisión automática del paquete con R CMD check --as-cran en Windows,
# macOS y Linux, cada vez que se actualiza el repositorio.
# Basado en los flujos de trabajo de r-lib/actions (versión 2).
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-tinytex@v2
      - name: Paquetes de LaTeX para el manual en PDF (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call tlmgr update --self
          call tlmgr install times helvetic courier psnfss inconsolata lm ec cm-super upquote url hyperref makeindex amsfonts
      - name: Paquetes de LaTeX para el manual en PDF
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tlmgr update --self || true
          tlmgr install times helvetic courier psnfss inconsolata lm ec cm-super upquote url hyperref makeindex amsfonts || true
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--compact-vignettes=gs+qpdf")'
          args: 'c("--as-cran")'
      - name: Mostrar el registro de LaTeX si falla el manual
        if: failure()
        shell: bash
        run: |
          find check -name "Rdlatex.log" -exec tail -n 60 {} \; || true
