# Construye el archivo .tar.gz del paquete con R CMD build, para enviarlo a CRAN.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

name: build

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: R CMD build
        run: R CMD build .
      - uses: actions/upload-artifact@v4
        with:
          name: paquete-cran
          path: agroestadistica_*.tar.gz
